<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña - Looped & Hooked</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-body">
    <main class="login-wrapper">
        <section class="login-card">
            <div class="login-left">
                <div class="login-left-overlay">
                    <img src="img/Looped&HookedLogo.png" alt="Logo Looped & Hooked" class="login-logo">
                    <div class="login-left-textbox">
                        <p class="login-small-title">SEGURIDAD DE TU CUENTA</p>
                        <h1>Cambiar contraseña</h1>
                        <p class="login-description">
                            Ingresa tu cédula y define una nueva contraseña segura.
                        </p>
                    </div>
                </div>
            </div>

            <div class="login-right">
                <div class="login-form-box">
                    <h2>Actualizar contraseña</h2>
                    <p class="login-text">
                        Completa los datos para cambiar tu contraseña.
                    </p>

                    <form class="login-form" onsubmit="cambiarPassword(event)" novalidate>
                        <input type="text" id="cedula" placeholder="Número de cédula" required minlength="9" maxlength="12" inputmode="numeric">
                        <input type="password" id="nuevaPassword" placeholder="Nueva contraseña" required minlength="8" maxlength="50">
                        <input type="password" id="confirmarPassword" placeholder="Confirmar nueva contraseña" required minlength="8" maxlength="50">

                        <p id="mensajeCambio"></p>
                        <button type="submit" class="btn-login">Guardar nueva contraseña</button>
                    </form>

                    <div class="register-box">
                        <p>¿Volver al inicio de sesión?</p>
                        <a href="login.html" class="btn-register">Ir al login</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        function validarCedula(cedula) {
            const regex = /^[0-9]{9,12}$/;
            return regex.test(cedula);
        }

        function validarPassword(password) {
            const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
            return regex.test(password);
        }

        function cambiarPassword(event) {
            event.preventDefault();

            const mensaje = document.getElementById("mensajeCambio");

            const cedula = document.getElementById("cedula").value.trim();
            const nuevaPassword = document.getElementById("nuevaPassword").value;
            const confirmarPassword = document.getElementById("confirmarPassword").value;

            mensaje.textContent = "";
            mensaje.style.color = "#c94b66";

            if (!cedula || !nuevaPassword || !confirmarPassword) {
                mensaje.textContent = "Debes completar todos los campos.";
                return;
            }

            if (!validarCedula(cedula)) {
                mensaje.textContent = "La cédula debe contener solo números y tener entre 9 y 12 dígitos.";
                return;
            }

            if (!validarPassword(nuevaPassword)) {
                mensaje.textContent = "La nueva contraseña debe tener mínimo 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial.";
                return;
            }

            if (nuevaPassword !== confirmarPassword) {
                mensaje.textContent = "La confirmación de contraseña no coincide.";
                return;
            }

            fetch("/backend/cambiar_password.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body:
                    "cedula=" + encodeURIComponent(cedula) +
                    "&nuevaPassword=" + encodeURIComponent(nuevaPassword) +
                    "&confirmarPassword=" + encodeURIComponent(confirmarPassword)
            })
            .then(response => response.text())
            .then(data => {
                const respuesta = data.trim();

                if (respuesta === "OK") {
                    mensaje.style.color = "#4d8b63";
                    mensaje.textContent = "Contraseña actualizada correctamente. Redirigiendo al login...";

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);
                } else {
                    mensaje.style.color = "#c94b66";
                    mensaje.textContent = respuesta;
                }
            })
            .catch(error => {
                console.error("Error:", error);
                mensaje.style.color = "#c94b66";
                mensaje.textContent = "Ocurrió un error al conectar con el servidor.";
            });
        }
    </script>
</body>

</html>
