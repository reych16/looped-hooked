<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Looped & Hooked</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-body">
    <main class="login-wrapper">
        <section class="login-card">

            <!-- Panel Izquierdo -->
            <div class="login-left">
                <div class="login-left-content">
                    <img src="img/Looped&HookedLogo.png" alt="Logo Looped & Hooked" class="login-logo">
                    <h1>Descubre Looped & Hooked</h1>
                    <p class="login-left-text">
                        Descubre un espacio donde la creatividad y el trabajo hecho a mano
                        se trans forman en piezas únicas, creadas con dedicación y detalle.
                    </p>
                    <div class="login-illustration">
                        <img src="img/login_shopping.svg" class="hero-illustration">
                    </div>
                </div>
            </div>

            <!-- Panel Derecho -->
            <div class="login-right">
                <div class="login-form-box">
                    <h2>Iniciar sesión</h2>
                    <p class="login-text">
                        Accede a tu cuenta para explorar Looped & Hooked.
                    </p>

                    <form class="login-form" id="loginForm">
                        <input type="text" id="loginUsuario" placeholder="Nombre de usuario" required>
                        <input type="password" id="loginPassword" placeholder="Contraseña" required>

                        <button type="submit" class="btn-login">Ingresar</button>
                    </form>

                    <p id="mensajeLogin"></p>

                    <p id="mensajeLogin"></p>

                    <div class="separator">
                        <span>o</span>
                    </div>

                    <div class="register-box">
                        <p>¿No tienes una cuenta?</p>
                        <a href="registro.html" class="btn-register">Crear cuenta</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            console.log("SE EJECUTA LOGIN"); // prueba

            event.preventDefault();

            let usuario = document.getElementById("loginUsuario").value;
            let password = document.getElementById("loginPassword").value;
            let mensaje = document.getElementById("mensajeLogin");

            mensaje.textContent = "";

            fetch("login.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "username=" + encodeURIComponent(usuario) +
                    "&password=" + encodeURIComponent(password)
            })
                .then(response => response.text())
                .then(data => {

                    console.log("Respuesta:", data);

                    if (data.trim() === "OK") {
                        alert("Login correcto ✅");
                        window.location.href = "index.html";
                    } else {
                        mensaje.textContent = "Usuario o contraseña incorrectos ❌";
                    }

                })
                .catch(error => {
                    console.error("Error:", error);
                });
        });
    </script>
</body>

</html>
